name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, to catch breakage from new ansible-core releases.
    - cron: "17 5 * * 1"
  workflow_dispatch:

# No default token permissions; each job asks for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    name: Sanity (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - stable-2.22
          - devel
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible_collections/newbenji/zitadel
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ansible-core ${{ matrix.ansible }}
        env:
          ANSIBLE_BRANCH: ${{ matrix.ansible }}
        run: python -m pip install "https://github.com/ansible/ansible/archive/${ANSIBLE_BRANCH}.tar.gz"
      - name: ansible-test sanity
        working-directory: ansible_collections/newbenji/zitadel
        run: ansible-test sanity --docker -v --color

  units:
    name: Units (ansible-core ${{ matrix.ansible }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        ansible:
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - stable-2.22
          - devel
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible_collections/newbenji/zitadel
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install ansible-core ${{ matrix.ansible }}
        env:
          ANSIBLE_BRANCH: ${{ matrix.ansible }}
        run: python -m pip install "https://github.com/ansible/ansible/archive/${ANSIBLE_BRANCH}.tar.gz"
      - name: ansible-test units
        working-directory: ansible_collections/newbenji/zitadel
        run: ansible-test units --docker -v --color

  lint:
    name: ansible-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ansible/ansible-lint@b74fb6f73d234bf92672372cb1c10768e4018d16 # v26.11.0

  workflow-security:
    name: zizmor (workflow security)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # Fail the job on findings instead of uploading to code scanning,
          # so it also works on pull requests from forks.
          advanced-security: false

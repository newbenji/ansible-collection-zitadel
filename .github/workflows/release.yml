name: Release

# Push a tag like v0.2.0 (matching galaxy.yml's version) to build the collection,
# attach it to a GitHub release and, if the GALAXY_API_KEY secret is set,
# publish it to Ansible Galaxy.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ansible-core
        run: python -m pip install ansible-core

      - name: Check tag matches galaxy.yml version
        run: |
          VERSION="$(python -c 'import yaml; print(yaml.safe_load(open("galaxy.yml"))["version"])')"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match galaxy.yml version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build collection
        run: ansible-galaxy collection build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: newbenji-zitadel-${{ env.VERSION }}.tar.gz
          generate_release_notes: true

      - name: Publish to Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        if: env.GALAXY_API_KEY != ''
        run: ansible-galaxy collection publish "newbenji-zitadel-${VERSION}.tar.gz" --api-key "$GALAXY_API_KEY"
